<head>

<body class="flowchart-page">

    <div id="chart-toolbar" role="group" aria-label="순서도 표시 설정">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 테마로 전환" title="다크 테마로 전환">
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
            <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button id="name-language" class="icon-button" type="button" aria-label="영어로 전환" title="영어로 전환" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="12" text-anchor="middle" dominant-baseline="central" class="language-glyph">가</text></svg>
        </button>
        <button id="code-format" class="icon-button" type="button" aria-label="현재 과목 코드" aria-pressed="true" title="과거 과목 코드로 전환" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3 6 21M18 3l-4 18M4 8h17M3 16h17"/></svg>
        </button>
        <button id="fit-diagram" class="icon-button" type="button" aria-label="줌 초기화" title="줌 초기화 · 전체 보기" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        </button>
    </div>
    <p id="diagram-status" class="diagram-status flowchart-status" role="status">순서도를 불러오는 중입니다.</p>
    <div id="myDiagramDiv" aria-label="학부·학과 교과목 순서도"></div>
    <noscript><p class="diagram-status flowchart-status">순서도를 보려면 JavaScript를 활성화해 주세요. <a href="index.html">학부·학과 목록으로 돌아가기</a></p></noscript>
